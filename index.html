<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alfabetización · Actividad diagnóstica</title>
  <meta name="description" content="Actividad diagnóstica en tiempo real para pensar juntas qué es estar alfabetizado." />

  <!-- Fija el tema antes de pintar para evitar el parpadeo claro/oscuro -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tema");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <main class="escena">
    <!-- Barra superior: marca + controles de tema y pantalla completa -->
    <header class="barra-superior">
      <div class="marca">
        <span class="punto" aria-hidden="true"></span>
        <span class="nombre">Alfabetización<span class="sub"> · actividad diagnóstica</span></span>
      </div>
      <div class="controles-barra">
        <button id="btn-tema" class="boton boton-icono" aria-label="Cambiar tema" aria-pressed="false">
          <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="btn-pantalla" class="boton boton-icono" aria-label="Pantalla completa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </header>

    <div class="centro">
      <div style="text-align:center; margin-bottom:36px;">
        <h1 class="titulo-grande">¿Qué significa estar<br />alfabetizado hoy?</h1>
        <p class="subtitulo">Una actividad para pensar juntas, antes de la teoría.</p>
      </div>

      <!-- Ingreso de estudiantes -->
      <section class="tarjeta" aria-labelledby="titulo-ingreso">
        <h2 id="titulo-ingreso" style="font-size:1.05rem; margin-bottom:16px;">Ingresar a una sala</h2>
        <label class="etiqueta" for="codigo">Código de la sala</label>
        <input id="codigo" class="campo" inputmode="text" autocomplete="off"
               placeholder="Ej. K7QP2" maxlength="6"
               style="text-transform:uppercase; letter-spacing:.15em; font-size:1.3rem; text-align:center;" />
        <button id="btn-entrar" class="boton boton-primario boton-grande" style="margin-top:16px;">
          Entrar a la sala
        </button>
        <p class="subtitulo" style="text-align:center; font-size:.9rem; margin-top:14px;">
          También podés entrar escaneando el código QR que muestra la docente.
        </p>
      </section>

      <hr class="linea-separadora" />

      <!-- Acceso docente -->
      <div style="text-align:center;">
        <a class="boton boton-suave" href="docente.html">Soy la docente · abrir panel</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { inicializarTema, alternarPantallaCompleta, avisar } from "./js/utils.js";

    inicializarTema(document.getElementById("btn-tema"));
    document.getElementById("btn-pantalla").addEventListener("click", alternarPantallaCompleta);

    const inputCodigo = document.getElementById("codigo");

    // Si vino con ?sala=XXXX (por ejemplo desde un enlace), lo precargamos.
    const salaEnURL = new URLSearchParams(location.search).get("sala");
    if (salaEnURL) inputCodigo.value = salaEnURL.toUpperCase();

    function entrar() {
      const codigo = inputCodigo.value.trim().toUpperCase();
      if (codigo.length < 4) { avisar("Ingresá el código completo de la sala."); return; }
      location.href = `estudiante.html?sala=${encodeURIComponent(codigo)}`;
    }

    document.getElementById("btn-entrar").addEventListener("click", entrar);
    inputCodigo.addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
  </script>
</body>
</html>
